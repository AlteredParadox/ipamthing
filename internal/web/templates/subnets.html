{{define "content"}}
<h1>Subnets</h1>
<form method="post" action="/subnets" class="inline-form">
<label>CIDR <input name="cidr" placeholder="192.168.1.0/24" required></label>
<label>Name <input name="name" placeholder="Home LAN"></label>
<label>Scan interval (s) <input name="scan_interval_sec" type="number" value="300" min="30"></label>
<button type="submit">Add subnet</button>
</form>

<table>
<thead><tr><th>CIDR</th><th>Name</th><th>Scanning</th><th>Interval</th><th>Last scan</th><th></th></tr></thead>
<tbody>
{{range .Data}}
<tr>
<td><a href="/subnets/{{.ID}}"><code>{{.CIDR}}</code></a></td>
<td>{{.Name}}</td>
<td>
<form method="post" action="/subnets/{{.ID}}/toggle" class="row-action">
<button type="submit" class="{{if .ScanEnabled}}secondary{{end}}">{{if .ScanEnabled}}disable{{else}}enable{{end}}</button>
</form>
</td>
<td>{{.ScanIntervalSec}}s</td>
<td>{{relTime .LastScanAt}}{{if .LastScanErr}} <span class="err-inline">!</span>{{end}}</td>
<td>
<form method="post" action="/subnets/{{.ID}}/delete" class="row-action" onsubmit="return confirm('Delete {{.CIDR}}?')">
<button type="submit" class="danger">Delete</button>
</form>
</td>
</tr>
{{else}}
<tr><td colspan="6"><em>No subnets yet. Add one above.</em></td></tr>
{{end}}
</tbody>
</table>
{{end}}
