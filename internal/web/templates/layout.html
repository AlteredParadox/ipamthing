{{define "csrf"}}<input type="hidden" name="csrf_token" value="{{.CSRF}}">{{end}}
{{define "layout"}}<!doctype html>
<html lang="en" data-theme="{{.Prefs.Theme}}" data-layout="{{.Prefs.Layout}}" data-density="{{.Prefs.Density}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} — ipamthing</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header>
<nav>
<strong>ipamthing</strong>
<a href="/">dashboard</a>
<a href="/subnets">subnets</a>
<a href="/events">events</a>
<a href="/settings">settings</a>
<form method="post" action="/logout" class="logout-form">{{template "csrf" .}}<button type="submit">logout</button></form>
</nav>
</header>
<main>
{{if .Flash}}<div class="flash">{{.Flash}}</div>{{end}}
{{if .Notice}}<div class="info">{{.Notice}}</div>{{end}}
{{template "content" .}}
</main>
</body>
</html>
{{end}}
