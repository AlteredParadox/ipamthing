# Portainer stack compose, attached to an existing macvlan (or ipvlan)
# network so ipamthing gets its own IP on the LAN.
#
# Before deploying: create the macvlan network in Portainer
#   (Networks → Add network → Driver: macvlan) and note its name.
# Stack env vars you can set in the Portainer deploy form:
#   MACVLAN_NETWORK   – name of the network created above (default: lan)
#   IPAMTHING_IP      – optional static IP for this container; omit to let
#                       the network's IPAM pool pick one (e.g. 10.0.0.42)

services:
  ipamthing:
    # Published by the release workflow for linux/amd64 and linux/arm64;
    # pin a version tag (e.g. :0.2.0) for reproducible deploys. To build
    # from source instead, replace `image:` with `build: .`.
    image: ghcr.io/alteredparadox/ipamthing:latest
    container_name: ipamthing
    restart: unless-stopped

    cap_add:
      - NET_RAW

    volumes:
      - ipamthing-data:/var/lib/ipamthing

    command:
      - -addr=:8080
      - -db=/var/lib/ipamthing/ipamthing.db
      # - -event-retention-days=90     # (default)
      # - -setup-token=change-me       # paste a value to skip the auto-generated one

    networks:
      lan:
        # Empty/unset => IPAM pool assigns. Set IPAMTHING_IP stack env to
        # pin a specific LAN IP (e.g. IPAMTHING_IP=10.0.0.42).
        ipv4_address: ${IPAMTHING_IP:-}

networks:
  lan:
    external: true
    name: ${MACVLAN_NETWORK:-lan}

volumes:
  ipamthing-data:
