name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: ipamthing-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: ipamthing-linux-arm64
          - goos: windows
            goarch: amd64
            artifact: ipamthing-windows-amd64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w" -o ${{ matrix.artifact }} .
          ls -la ${{ matrix.artifact }}
          sha256sum ${{ matrix.artifact }}
