name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build all targets
        run: |
          for target in "linux amd64" "linux arm64" "windows amd64"; do
            set -- $target
            os=$1 arch=$2
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            name="ipamthing-${os}-${arch}${ext}"
            echo "--- building ${name} ---"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags="-s -w" -o "$name" .
            sha256sum "$name"
          done

      - name: Create release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          API="${GITHUB_SERVER_URL}/api/v1"
          REPO="${GITHUB_REPOSITORY}"

          # Create the release
          RELEASE_ID=$(curl -sS -X POST \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"Automated build from tag ${TAG}\"}" \
            "${API}/repos/${REPO}/releases" | jq -r '.id')

          echo "Created release ${TAG} (id=${RELEASE_ID})"

          # Upload each binary
          for f in ipamthing-*; do
            echo "Uploading ${f}..."
            curl -sS -X POST \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${f}" \
              "${API}/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${f}"
            echo ""
          done
